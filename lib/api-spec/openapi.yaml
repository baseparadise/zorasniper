openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Zora Sniper API - Auto trade bot for Zora Coins on Base
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bot
    description: Bot control
  - name: config
    description: Bot configuration
  - name: creators
    description: Creator whitelist
  - name: trades
    description: Trade history
  - name: dashboard
    description: Dashboard overview
  - name: manual
    description: Manual trading
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /bot/status:
    get:
      operationId: getBotStatus
      tags: [bot]
      summary: Get bot running status and stats
      responses:
        "200":
          description: Bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /bot/start:
    post:
      operationId: startBot
      tags: [bot]
      summary: Start the sniper bot
      responses:
        "200":
          description: Bot started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /bot/stop:
    post:
      operationId: stopBot
      tags: [bot]
      summary: Stop the sniper bot
      responses:
        "200":
          description: Bot stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /config:
    get:
      operationId: getConfig
      tags: [config]
      summary: Get bot configuration
      responses:
        "200":
          description: Bot configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConfig"
    put:
      operationId: updateConfig
      tags: [config]
      summary: Update bot configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigUpdate"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConfig"

  /creators:
    get:
      operationId: listCreators
      tags: [creators]
      summary: List whitelisted creators
      responses:
        "200":
          description: List of creators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Creator"
    post:
      operationId: addCreator
      tags: [creators]
      summary: Add creator to whitelist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorInput"
      responses:
        "201":
          description: Creator added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Creator"
        "400":
          description: Invalid address or already exists

  /creators/{address}:
    delete:
      operationId: removeCreator
      tags: [creators]
      summary: Remove creator from whitelist
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
    patch:
      operationId: updateCreator
      tags: [creators]
      summary: Update creator label, enabled state, or per-wallet sniper settings
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorPatch"
      responses:
        "200":
          description: Updated creator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Creator"

  /trades:
    get:
      operationId: listTrades
      tags: [trades]
      summary: List trade history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, failed, sold, skipped]
      responses:
        "200":
          description: Trade list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"

  /trades/stats:
    get:
      operationId: getTradeStats
      tags: [trades]
      summary: Get trading statistics
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeStats"

  /trades/manual-buy:
    post:
      operationId: manualBuy
      tags: [manual]
      summary: Execute a manual buy for a given token address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualBuyRequest"
      responses:
        "201":
          description: Trade created (pending — tx executes in background)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "400":
          description: Invalid input
        "500":
          description: Execution error

  /positions:
    get:
      operationId: listPositions
      tags: [manual]
      summary: List open manual positions (manual buys not yet sold)
      responses:
        "200":
          description: Open positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"

  /positions/{id}/sell:
    post:
      operationId: marketSell
      tags: [manual]
      summary: Market sell all tokens for a position immediately via Li.Fi
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Sell submitted (executes in background)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "400":
          description: No balance to sell
        "404":
          description: Position not found or already closed
        "500":
          description: Wallet not configured

  /positions/{id}/tpsl:
    put:
      operationId: updateTpSl
      tags: [manual]
      summary: Update take profit / stop loss for an open position
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTpSlRequest"
      responses:
        "200":
          description: Updated trade record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "400":
          description: Invalid input
        "404":
          description: Position not found or already closed

  /token/{address}:
    get:
      operationId: getTokenInfo
      tags: [manual]
      summary: Get on-chain token info (name, symbol, price estimate, MC)
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenInfo"
        "400":
          description: Invalid address
        "500":
          description: RPC error

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardData"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    BotStatus:
      type: object
      required: [running, walletAddress, walletBalanceEth, totalTrades, uptimeSeconds]
      properties:
        running:
          type: boolean
        walletAddress:
          type: ["string", "null"]
        walletBalanceEth:
          type: ["string", "null"]
        totalTrades:
          type: integer
        snipedToday:
          type: integer
        uptimeSeconds:
          type: integer
        lastEventAt:
          type: ["string", "null"]
        network:
          type: string

    BotConfig:
      type: object
      required:
        - buyAmountEth
        - slippagePercent
        - maxGasGwei
        - watchMode
        - enabled
      properties:
        buyAmountEth:
          type: string
          description: ETH amount per snipe e.g. "0.01"
        slippagePercent:
          type: number
          description: Slippage tolerance in percent
        maxGasGwei:
          type: number
          description: Max gas price in Gwei
        watchMode:
          type: string
          enum: [whitelist, all]
          description: Whitelist = only listed creators, all = any new coin
        enabled:
          type: boolean
        minLiquidityEth:
          type: ["number", "null"]
        autoSell:
          type: boolean
        takeProfitPercent:
          type: ["number", "null"]
        stopLossPercent:
          type: ["number", "null"]
        maxBuysPerDay:
          type: ["integer", "null"]
          description: Global max buys per creator wallet per day. null = no limit

    ConfigUpdate:
      type: object
      properties:
        buyAmountEth:
          type: string
        slippagePercent:
          type: number
        maxGasGwei:
          type: number
        watchMode:
          type: string
          enum: [whitelist, all]
        enabled:
          type: boolean
        minLiquidityEth:
          type: ["number", "null"]
        autoSell:
          type: boolean
        takeProfitPercent:
          type: ["number", "null"]
        stopLossPercent:
          type: ["number", "null"]
        maxBuysPerDay:
          type: ["integer", "null"]
          description: Global max buys per creator wallet per day. null = no limit

    Creator:
      type: object
      required: [address, label, enabled, addedAt, totalSniped]
      properties:
        address:
          type: string
        label:
          type: string
        enabled:
          type: boolean
        addedAt:
          type: string
          format: date-time
        totalSniped:
          type: integer
        zoraProfileUrl:
          type: ["string", "null"]
        buyAmountEth:
          type: ["string", "null"]
          description: Per-wallet ETH buy amount. null = use global config
        slippagePercent:
          type: ["number", "null"]
          description: Per-wallet slippage %. null = use global config
        maxGasGwei:
          type: ["number", "null"]
          description: Per-wallet max gas in Gwei. null = use global config
        autoSell:
          type: ["boolean", "null"]
          description: Per-wallet auto sell override. null = use global config
        takeProfitPercent:
          type: ["number", "null"]
          description: Per-wallet take profit %. null resets to global
        stopLossPercent:
          type: ["number", "null"]
          description: Per-wallet stop loss %. null resets to global
        maxBuysPerDay:
          type: ["integer", "null"]
          description: Per-wallet max buys per day. null resets to global

    CreatorInput:
      type: object
      required: [address]
      properties:
        address:
          type: string
        label:
          type: string

    CreatorPatch:
      type: object
      properties:
        label:
          type: string
        enabled:
          type: boolean
        buyAmountEth:
          type: ["string", "null"]
        slippagePercent:
          type: ["number", "null"]
        maxGasGwei:
          type: ["number", "null"]
        autoSell:
          type: ["boolean", "null"]
        takeProfitPercent:
          type: ["number", "null"]
          description: Per-wallet take profit %. null resets to global
        stopLossPercent:
          type: ["number", "null"]
          description: Per-wallet stop loss %. null resets to global
        maxBuysPerDay:
          type: ["integer", "null"]
          description: Per-wallet max buys per day. null resets to global

    Trade:
      type: object
      required:
        - id
        - tokenAddress
        - tokenName
        - tokenSymbol
        - creatorAddress
        - buyAmountEth
        - timestamp
        - status
        - source
      properties:
        id:
          type: integer
        txHash:
          type: ["string", "null"]
        tokenAddress:
          type: string
        tokenName:
          type: string
        tokenSymbol:
          type: string
        creatorAddress:
          type: string
        buyAmountEth:
          type: string
        tokenAmount:
          type: ["string", "null"]
        gasUsedEth:
          type: ["string", "null"]
        timestamp:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, confirmed, failed, sold, skipped]
        source:
          type: string
          enum: [sniper, manual]
        takeProfitPercent:
          type: ["string", "null"]
        stopLossPercent:
          type: ["string", "null"]
        entryValueUsdc:
          type: ["string", "null"]
          description: USDC value of token position at buy time (from sell-direction quote). Used as TP/SL cost basis.
        sellTxHash:
          type: ["string", "null"]
        sellAmountEth:
          type: ["string", "null"]
        pnlEth:
          type: ["string", "null"]
        blockNumber:
          type: ["integer", "null"]

    UpdateTpSlRequest:
      type: object
      properties:
        takeProfitPercent:
          type: ["number", "null"]
          description: New take profit % (null to disable)
        stopLossPercent:
          type: ["number", "null"]
          description: New stop loss % (null to disable)

    ManualBuyRequest:
      type: object
      required:
        - tokenAddress
        - buyAmountEth
        - slippagePercent
      properties:
        tokenAddress:
          type: string
          description: EVM contract address of the Zora token to buy
        buyAmountEth:
          type: string
          description: ETH amount to spend, e.g. "0.05"
        slippagePercent:
          type: number
          description: Max slippage in percent, e.g. 5 = 5%
        takeProfitPercent:
          type: ["number", "null"]
          description: Auto-sell when P&L reaches this %. null = disabled
        stopLossPercent:
          type: ["number", "null"]
          description: Auto-sell when loss reaches this %. null = disabled

    Position:
      type: object
      required:
        - trade
        - currentBalanceTokens
        - entryPriceEth
        - currentValueEth
        - pnlPercent
      properties:
        trade:
          $ref: "#/components/schemas/Trade"
        currentBalanceTokens:
          type: string
          description: Current on-chain token balance for this wallet
        entryPriceEth:
          type: string
          description: ETH paid per token at entry
        currentValueEth:
          type: string
          description: Estimated current value in ETH (balance * current price)
        pnlPercent:
          type: number
          description: Unrealised P&L in percent relative to entry

    TokenInfo:
      type: object
      required:
        - address
        - name
        - symbol
        - totalSupply
        - walletBalance
        - priceEth
        - mcEth
      properties:
        address:
          type: string
        name:
          type: string
        symbol:
          type: string
        totalSupply:
          type: string
          description: Human-readable total supply (18 decimals divided)
        walletBalance:
          type: string
          description: Current wallet balance in tokens
        priceEth:
          type: string
          description: Estimated ETH price per token (from small-buy simulation)
        mcEth:
          type: string
          description: Estimated market cap in ETH

    TradeStats:
      type: object
      required:
        - totalTrades
        - successfulTrades
        - failedTrades
        - totalEthSpent
        - totalEthRecovered
        - totalPnlEth
        - winCount
        - lossCount
      properties:
        totalTrades:
          type: integer
        successfulTrades:
          type: integer
        failedTrades:
          type: integer
        totalEthSpent:
          type: string
        totalEthRecovered:
          type: string
        totalPnlEth:
          type: string
        winCount:
          type: integer
        lossCount:
          type: integer
        winRatePercent:
          type: number
        avgBuyAmountEth:
          type: string
        todayTrades:
          type: integer
        todayEthSpent:
          type: string

    DashboardData:
      type: object
      required: [botStatus, recentTrades, stats, topCreators]
      properties:
        botStatus:
          $ref: "#/components/schemas/BotStatus"
        recentTrades:
          type: array
          items:
            $ref: "#/components/schemas/Trade"
        stats:
          $ref: "#/components/schemas/TradeStats"
        topCreators:
          type: array
          items:
            $ref: "#/components/schemas/Creator"
